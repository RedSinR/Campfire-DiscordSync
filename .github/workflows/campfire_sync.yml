
name: Campfire Meetup Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17,42 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps firefox

      - name: Read Campfire meetups
        run: python campfire_events.py

      - name: Post meetups to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python discord_notify.py

      - name: Save announcement tracking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add announced_events.json
          git diff --cached --quiet || git commit -m "Update announced meetup tracking"
          git push
